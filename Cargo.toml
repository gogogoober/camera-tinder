[workspace]
resolver = "3"
members = ["crates/cull-core", "crates/cull-platform-fs", "crates/cull-platform-apple", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Image decoding is ~10-20x slower unoptimized; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 3
