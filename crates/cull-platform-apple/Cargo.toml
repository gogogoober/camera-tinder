[package]
name = "cull-platform-apple"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
cull-core = { version = "0.1.0", path = "../cull-core" }
chrono = "0.4.45"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["std", "EKEventStore", "EKEvent", "EKCalendarItem", "EKObject", "EKTypes", "block2", "EKCalendar"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSString", "NSError", "NSArray", "NSEnumerator", "NSCalendar", "NSTimeZone", "NSDateFormatter", "NSLocale", "block2", "NSData", "NSDictionary", "NSValue"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNObservation", "VNFaceObservationAccepting", "VNDetectFaceRectanglesRequest", "VNDetectFaceLandmarksRequest", "VNFaceLandmarks", "VNDetectFaceCaptureQualityRequest", "VNGenerateImageFeaturePrintRequest", "VNGenerateAttentionBasedSaliencyImageRequest", "VNDetectHorizonRequest", "VNCalculateImageAestheticsScoresRequest", "VNTypes", "VNGeometry", "objc2-core-foundation"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
serde_json = "1.0.154"
