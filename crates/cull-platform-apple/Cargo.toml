[package]
name = "cull-platform-apple"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
cull-core = { version = "0.1.0", path = "../cull-core" }
chrono = "0.4.45"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6"
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["std", "EKEventStore", "EKEvent", "EKCalendarItem", "EKObject", "EKTypes", "block2", "EKCalendar"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSString", "NSError", "NSArray", "NSEnumerator", "NSCalendar", "NSTimeZone", "NSDateFormatter", "NSLocale", "block2"] }
